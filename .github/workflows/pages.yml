name: Deploy Pages

# Publishing is an explicit action after approval, not a side effect of merge.
on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            pages: read
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - uses: actions/configure-pages@v5
              id: pages
            - name: Confirm custom-domain target
              run: node scripts/check-pages-target.mjs
              env:
                  PAGES_URL: ${{ steps.pages.outputs.base_url }}
            - run: npm ci
            - run: npm run lint
            - run: npm test
            - run: npx playwright install --with-deps chromium
            - run: npm run test:e2e:pages
            - uses: actions/upload-pages-artifact@v4
              with:
                  path: dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Publish approved artifact
              id: deployment
              uses: actions/deploy-pages@v4
